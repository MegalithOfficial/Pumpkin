[package]
name = "pumpkin-world"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
gpu-worldgen = []
cuda-worldgen = ["gpu-worldgen", "dep:cudarc"]
cuda-worldgen-all = ["cuda-worldgen"]
vulkan-worldgen = ["gpu-worldgen", "dep:vulkano"]

[dependencies]
vulkano = { version = "0.35", optional = true }
cudarc = { version = "0.19.10", optional = true, default-features = false, features = [
    "std",
    "driver",
    "nvrtc",
    "dynamic-loading",
    "cuda-12000",
] }

pumpkin-nbt.workspace = true
pumpkin-util.workspace = true
pumpkin-config.workspace = true
pumpkin-data = { workspace = true, features = ["default"] }

futures.workspace = true

bytes.workspace = true

tokio = { workspace = true, features = [
    "macros",
    "sync",
    "fs",
    "io-util",
    "time",
] }
uuid.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
crossbeam.workspace = true

sha2.workspace = true
md5.workspace = true
bitflags.workspace = true
arc-swap.workspace = true

dashmap.workspace = true

# Compression
flate2.workspace = true
lz4-java-wrc.workspace = true
ruzstd.workspace = true
xxhash-rust.workspace = true

rayon.workspace = true

# thread_local.workspace = true

tokio-util = { workspace = true, features = ["rt"] }
rand.workspace = true
rustc-hash.workspace = true
slotmap.workspace = true

[dev-dependencies]
tempfile.workspace = true
criterion = { workspace = true, features = ["html_reports", "async_tokio"] }

[[bench]]
name = "chunk"
harness = false

[[bench]]
name = "chunk_io"
harness = false

[[bench]]
name = "chunk_gen"
harness = false

[[bench]]
name = "chunk_gen_concurrent"
harness = false

[[bench]]
name = "jigsaw"
harness = false

[[bench]]
name = "noise_router"
harness = false

[[bench]]
name = "template_pool"
harness = false

[lints]
workspace = true
